# Reusable CI pipeline for a PixelPerfect Magento module.
#
# Consume from a module's .gitlab-ci.yml:
#   include:
#     - project: pixelperfect-at-m2-modules/ci-templates
#       ref: main
#       file: /gitlab/magento-module.yml
#
# Required CI/CD variables, set once on the group pixelperfect-at-m2-modules (masked, not protected):
#   MAGENTO_PUBLIC_KEY  / MAGENTO_PRIVATE_KEY   → Composer http-basic for repo.magento.com
# Private inter-module deps (coding-standard, other pixelperfectat modules) are cloned via the
# built-in CI_JOB_TOKEN — allowlist this group under each depended-on repo's CI/CD → Token Access.

# Same image the shops develop on: it ships and loads Xdebug, which Infection needs for coverage.
image: markoshust/magento-php:8.3-fpm-4

# Without this, pushing a branch that has an open merge request runs TWO full
# pipelines -- one `push`, one `merge_request_event` -- doubling every job.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - validate
  - check
  - release

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

default:
  cache:
    key: composer-$CI_COMMIT_REF_SLUG
    paths:
      - vendor/
      - .composer-cache/
  before_script:
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
    - composer config --global --auth http-basic.repo.magento.com "$MAGENTO_PUBLIC_KEY" "$MAGENTO_PRIVATE_KEY"
    - composer config --global --auth http-basic.gitlab.com gitlab-ci-token "$CI_JOB_TOKEN"
    # A module may depend on a licensed package whose repository is issued per licence, so its URL
    # cannot live in a shared composer.json without tying the package to one customer. Supply it
    # through CI variables instead; modules without them are unaffected.
    - |
      if [ -n "${EXTRA_COMPOSER_REPO_URL:-}" ]; then
        composer config repositories.licensed composer "$EXTRA_COMPOSER_REPO_URL"
        composer config --global --auth "http-basic.${EXTRA_COMPOSER_REPO_HOST}" \
          "$EXTRA_COMPOSER_REPO_USER" "$EXTRA_COMPOSER_REPO_PASS"
      fi
    - composer install --no-interaction --no-progress --no-ansi

commitlint:
  stage: validate
  image: alpine:latest
  cache: []
  before_script:
    - apk add --no-cache git
  variables:
    GIT_DEPTH: "50"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_TAG == null
  script:
    - |
      # Determine the range of commits to check.
      # MR pipeline: use the diff-base provided by GitLab.
      # Branch push: use CI_COMMIT_BEFORE_SHA; skip if all-zeros (new branch / first push).
      ZERO="0000000000000000000000000000000000000000"

      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ "$CI_COMMIT_BEFORE_SHA" = "$ZERO" ] || [ -z "$CI_COMMIT_BEFORE_SHA" ]; then
        # New branch or first push — check only the tip commit.
        BASE=""
      else
        BASE="$CI_COMMIT_BEFORE_SHA"
      fi

      check_commit() {
        SUBJECT="$1"
        BODY="$2"
        FULL_MSG="${SUBJECT}
      ${BODY}"
        FAILED=0

        # Rule 1: keyword-first subject — Merge commits are exempt from this rule only
        IS_MERGE=0
        if printf '%s' "$SUBJECT" | grep -qE '^Merge (branch|remote-tracking) '; then
          IS_MERGE=1
        fi
        # PR/MR merge-preview commit: "Merge <sha> into <sha>"
        if printf '%s' "$SUBJECT" | grep -qE '^Merge [0-9a-f]+ into [0-9a-f]+$'; then
          IS_MERGE=1
        fi

        if [ "$IS_MERGE" -eq 0 ]; then
          KEYWORD_RE='^(Add|Implement|Introduce|Update|Refactor|Improve|Change|Bump|Deprecate|Remove|Delete|Drop|Fix|Correct|Resolve|Security) .+'
          ISSUE_RE='^\[[^]]+\] (Add|Implement|Introduce|Update|Refactor|Improve|Change|Bump|Deprecate|Remove|Delete|Drop|Fix|Correct|Resolve|Security) .+'
          if ! printf '%s' "$SUBJECT" | grep -qE "$KEYWORD_RE|$ISSUE_RE"; then
            printf 'ERROR: Subject does not start with a house keyword: %s\n' "$SUBJECT" >&2
            FAILED=1
          fi
        fi

        return $FAILED
      }

      if [ -n "$BASE" ]; then
        git fetch --depth=50 origin "$BASE" 2>/dev/null || true
      fi
      # Only diff a base that's actually reachable; a force-push can orphan the old
      # before-SHA, and 'git log <gone>..SHA' fails (exit 128) under set -e.
      if [ -n "$BASE" ] && git rev-parse -q --verify "${BASE}^{commit}" >/dev/null 2>&1; then
        COMMITS="$(git log --format="%H" "${BASE}..${CI_COMMIT_SHA}")"
      else
        # New branch / first push / orphaned base — check the tip commit only
        COMMITS="$CI_COMMIT_SHA"
      fi

      # Avoid pipe-subshell: write SHAs to a temp file then iterate
      TMPFILE="$(mktemp)"
      printf '%s\n' "$COMMITS" > "$TMPFILE"

      FAILED_TOTAL=0
      while IFS= read -r SHA; do
        [ -z "$SHA" ] && continue
        SUBJECT="$(git log -1 --format="%s" "$SHA")"
        BODY="$(git log -1 --format="%b" "$SHA")"
        if ! check_commit "$SUBJECT" "$BODY"; then
          FAILED_TOTAL=1
        fi
      done < "$TMPFILE"
      rm -f "$TMPFILE"

      if [ "$FAILED_TOTAL" -ne 0 ]; then
        exit 1
      fi

# One job, not four. The gates were separate stages, so they already ran sequentially --
# splitting them bought no parallelism and paid for a full `composer install` four times.
# `composer check` is the same script developers run locally.
check:
  stage: check
  variables:
    # Infection (inside composer check) needs a coverage driver. The image loads Xdebug; this
    # sets its mode. Composer and PHPStan restart themselves without Xdebug.
    XDEBUG_MODE: coverage
  script:
    - php -m | grep -i '^xdebug$'
    # Runs here rather than only inside `composer check`, so no module can opt out by
    # editing its own scripts. A parent naming a child fails the pipeline.
    - php vendor/pixelperfectat/coding-standard/bin/check-module-boundaries.php
    # Magento resolves observers, plugins and DI arguments at runtime, so a class deleted
    # while its wiring stays behind passes every PHP-level gate and fails on a live request.
    - php vendor/pixelperfectat/coding-standard/bin/check-xml-class-refs.php
    # json_encode, strtotime, uniqid and the rest are valid PHP that phpcs has no sniff for
    # and phpstan no opinion about, so only a dedicated check sees them.
    - php vendor/pixelperfectat/coding-standard/bin/check-framework-internals.php
    - composer check

# On a semver tag push, publish a GitLab Release using the matching CHANGELOG.md section.
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  cache: []
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script:
    - |
      if [ -f CHANGELOG.md ]; then
        awk "/^## \\[${CI_COMMIT_TAG}\\]/{f=1;next} /^## \\[/{if(f)exit} f" CHANGELOG.md > release_notes.md
      fi
      [ -s release_notes.md ] || printf "Release %s\n" "$CI_COMMIT_TAG" > release_notes.md
      cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Version $CI_COMMIT_TAG"
    description: release_notes.md

# On a semver tag push, publish the tagged package to the project's Composer registry.
publish:
  stage: release
  cache: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  before_script: []
  script:
    - |
      curl --fail --silent --show-error \
           --data tag="${CI_COMMIT_TAG}" \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/composer"
